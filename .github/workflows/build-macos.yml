name: Build LivingPath for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller lightgbm

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean LivingPath.spec

      - name: Check application bundle
        run: test -d "dist/LivingPath.app"

      - name: Create DMG staging folder
        run: |
          mkdir -p dmg
          cp -R dist/LivingPath.app dmg/
          ln -s /Applications dmg/Applications

      - name: Create DMG
        run: hdiutil create -volname LivingPath -srcfolder dmg -ov -format UDZO LivingPath-macOS-arm64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: LivingPath-macOS-arm64
          path: LivingPath-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 14
