Double-click the DMG, then drag LivingPath into Applications.

Expected result

A native Apple Silicon app packaged in a downloadable DMG, built on GitHub rather than your Mac.

Security note

This build is not signed or notarized by Apple. macOS may warn you when opening it for the first time. The workflow also does not yet test the app's actual GUI launch.
If the build fails

Don't start changing random settings. We can use the error log to identify the exact dependency or packaging issue.

Common possibilities include:

    A Python dependency that cannot be installed on the selected runner.

    A missing native library or resource.

    A PyInstaller configuration issue.

    A dependency that installs successfully but fails when LivingPath launches.

The current workflow is a first build attempt, not a verified, working release. We should confirm that it produces the app and that the app opens before relying on the DMG.

