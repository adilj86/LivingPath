name: Build macOS DMG (Unsigned)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: pyinstaller LivingPath.spec --clean

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LivingPath Installer" \
            "dist/LivingPath-Installer.dmg" \
            "dist/LivingPath.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: LivingPath-macOS-DMG
          path: dist/LivingPath-Installer.dmg
